# Config Swagger
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
app.openapi.server-url=${dgp.server.url:http://localhost:8080}

# Config BDD
spring.datasource.url=${dgp.db.url:jdbc:postgresql://localhost:5432/dead_god_db}
spring.datasource.username=${dgp.db.username:postgres}
spring.datasource.password=${dgp.db.password:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=false

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
